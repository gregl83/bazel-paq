name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  USE_BAZEL_VERSION: 9.2.0

jobs:
  all-go:
    name: all systems go
    runs-on: ubuntu-latest
    needs:
      - test
    if: ${{ always() }}
    steps:
      - name: Check Test Results
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success

  test:
    name: test (${{ matrix.os }}, ${{ matrix.architecture }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux ---
          - os: ubuntu-latest
            architecture: x64

          # --- Windows ---
          - os: windows-latest
            architecture: x64

          # --- macOS Apple Silicon ---
          - os: macos-latest
            architecture: arm64
          # --- macOS Intel ---
          - os: macos-15-intel
            architecture: x64
    steps:
      - name: Preserve Unix Line Endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Install Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: 1.29.0
          bazelisk-cache: true
          repository-cache: true

      - name: Configure macOS Utilities
        if: runner.os == 'macOS'
        run: |
          if ! brew list coreutils >/dev/null 2>&1; then
            brew install coreutils
          fi
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Configure Windows Bash
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "BAZEL_SH=C:/Program Files/Git/bin/bash.exe" >> $env:GITHUB_ENV
          "C:/Program Files/Git/usr/bin" >> $env:GITHUB_PATH

      # Each matrix job runs exactly one of these platform-specific test steps.
      - name: Run Tests on Linux and macOS
        if: runner.os != 'Windows'
        run: bazel test //tests:all --action_env=PATH --test_output=all

      - name: Run Tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: bazel --windows_enable_symlinks test //tests:all --shell_executable="$env:BAZEL_SH" --enable_runfiles --action_env=PATH --test_output=all
